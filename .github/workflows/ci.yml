name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (py ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.10', '3.12']
    timeout-minutes: 15
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check (all Python files)
        run: python -m compileall -q .

      - name: Audio smoke test (synthesis, playback, mute, save round-trip)
        run: python tools/smoke_audio.py

      - name: Game-loop integration test (play / jump / death / win)
        run: python tools/smoke_game.py

      - name: Screenshot rendering + validation
        run: |
          python tools/screenshot.py
          python tools/check_screenshot.py

      - name: Security audit (dependencies)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict
